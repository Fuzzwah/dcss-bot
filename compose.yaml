services:
  webtiles:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: localhost/dcss-webtiles:0.34.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state
    environment:
      LANG: C.UTF-8
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
